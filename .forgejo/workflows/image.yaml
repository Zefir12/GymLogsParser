# Builds the API image (GymLogsParser/Dockerfile, registrydedic.zefirlabs.net/gymlogsparser).
# The Vue frontend is not built here: Cloudflare Pages builds it on every push to main.
# On a pull request it only builds, as a check, and only when the PR touches what the
# image build depends on beyond the code. On a push to develop it also pushes to the
# registry as `develop-<sha>` and `develop`; on a push to main as `main-<sha>` and
# `latest` (rebuilt from main, not promoted from develop).
# On a push to main the `deploy` job then deploys the pushed image to production through
# nudge, by digest (deploy/README.md, CI). There is no staging deployment, so develop
# only pushes its image.
# Jobs get no Docker socket, so kaniko builds the image: no daemon, no privileges, and
# it pushes straight to the registry.
#
# Outputs for the deploy job (`needs: image`), set only on runs that push:
#   tag               the immutable tag, e.g. develop-0123456789ab
#   digest-<name>     the pushed image's digest (sha256:...), one per matrix entry;
#                     deploy by `<image>@<digest>`, not by the moving tag.
# Each matrix leg sets only its own `digest-<name>` key, so legs don't overwrite each
# other; a new matrix entry needs its line under `outputs`.
name: image

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - .dockerignore
      - '**/*.csproj'
      - GymLogsParser/Dockerfile
      - .forgejo/workflows/image.yaml

# Pull requests cancel their older builds; pushes for a branch queue up, so `develop`
# (and `main`) end on the newest commit.
concurrency:
  group: image-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.name }})
    runs-on: docker
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Context is the repo root: the Dockerfile copies the whole solution. The root
          # .dockerignore applies.
          - name: gymlogsparser
            image: registrydedic.zefirlabs.net/gymlogsparser
            context: .
            dockerfile: GymLogsParser/Dockerfile
    container:
      image: node:24 # checkout needs node; the build itself runs in kaniko's container
    env:
      IMAGE: ${{ matrix.image }}
      CONTEXT: ${{ matrix.context }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      PUSH: ${{ forgejo.event_name != 'pull_request' }}
    outputs:
      tag: ${{ steps.digest.outputs.tag }}
      digest-gymlogsparser: ${{ steps.digest.outputs.digest-gymlogsparser }}

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      # TAG is pushed on every push; MOVING is `develop` from develop, `latest` from main.
      - name: Tag
        run: |
          branch=$(echo "${{ forgejo.ref_name }}" | tr -c 'A-Za-z0-9_.\n-' '-')
          echo "TAG=$branch-$(git rev-parse --short=12 HEAD)" >> "$FORGEJO_ENV"
          if [ "$branch" = develop ]; then echo "MOVING=develop" >> "$FORGEJO_ENV"; fi
          if [ "$branch" = main ]; then echo "MOVING=latest" >> "$FORGEJO_ENV"; fi

      # Runs in its own container with the workspace mounted. Credentials go into kaniko's
      # config only on the runs that push; pull requests build without pushing. The
      # digest file lands in the workspace for the next step.
      - name: Build and push
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0-debug
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          entrypoint: /busybox/sh
          args: |
            -euc '
            rm -f "$PWD/.image-digest";
            if [ "$PUSH" = true ]; then
              if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASSWORD" ]; then
                echo "REGISTRY_USER/REGISTRY_PASSWORD secrets are not set" >&2; exit 1;
              fi;
              auth=$(printf "%s:%s" "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d "\n");
              printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" "${IMAGE%%/*}" "$auth" > /kaniko/.docker/config.json;
              set -- --destination "$IMAGE:$TAG" --digest-file "$PWD/.image-digest";
              if [ -n "${MOVING:-}" ]; then set -- "$@" --destination "$IMAGE:$MOVING"; fi;
            else
              set -- --no-push;
            fi;
            /kaniko/executor --context "dir://$PWD/$CONTEXT" --dockerfile "$PWD/$DOCKERFILE" \
              --single-snapshot "$@"
            '

      - name: Digest
        id: digest
        if: env.PUSH == 'true'
        env:
          NAME: ${{ matrix.name }}
        run: |
          digest=$(cat .image-digest)
          case "$digest" in
            sha256:*) ;;
            *) echo "unexpected digest: '$digest'" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$FORGEJO_OUTPUT"
          echo "digest-$NAME=$digest" >> "$FORGEJO_OUTPUT"
          echo "pushed $IMAGE:$TAG@$digest"

  # Deploys the image this run pushed to production through nudge (deploy/README.md, CI),
  # on pushes to main only: never for develop, pull requests or anything else. nudge
  # pulls, brings the stack up and runs the deployment's health checks; the job follows
  # the run's progress stream and fails unless the run ends `succeeded` (`failed`,
  # `rolled_back`, `superseded` and a broken stream all fail).
  deploy:
    name: deploy (prod)
    needs: image
    if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
    runs-on: docker
    timeout-minutes: 25
    # One prod deploy at a time; later ones wait, none is cancelled. (nudge also runs a
    # deployment's runs one at a time.)
    concurrency:
      group: gymlogsparser-prod-deploy
      cancel-in-progress: false
    container:
      image: node:24 # has bash and curl; node parses the final status line
    env:
      NUDGE_SERVER_URL: ${{ vars.NUDGE_SERVER_URL }}
      NUDGE_DEPLOYMENT: ${{ vars.NUDGE_DEPLOYMENT }}
      TAG: ${{ needs.image.outputs.tag }}
      API_IMAGE_REPO: registrydedic.zefirlabs.net/gymlogsparser
      API_DIGEST: ${{ needs.image.outputs.digest-gymlogsparser }}

    steps:
      # The token reaches curl through a config on stdin (printf is a shell builtin), so
      # it is never on a command line or in the log. No `set -x` here.
      - name: Deploy
        shell: bash
        env:
          NUDGE_DEPLOY_TOKEN: ${{ secrets.NUDGE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          # Named as in Forgejo, so the message says which setting is missing.
          [ -n "${NUDGE_DEPLOY_TOKEN:-}" ] || { echo "secret NUDGE_DEPLOY_TOKEN is not set" >&2; exit 1; }
          [ -n "${NUDGE_SERVER_URL:-}" ] || { echo "variable NUDGE_SERVER_URL is not set" >&2; exit 1; }
          [ -n "${NUDGE_DEPLOYMENT:-}" ] || { echo "variable NUDGE_DEPLOYMENT is not set" >&2; exit 1; }
          if ! [[ "$NUDGE_DEPLOYMENT" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "NUDGE_DEPLOYMENT is not a deployment name: '$NUDGE_DEPLOYMENT'" >&2; exit 1
          fi
          if ! [[ "${API_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "bad API image digest: '${API_DIGEST:-}'" >&2; exit 1
          fi
          body="{\"variables\":{\"API_IMAGE\":\"$API_IMAGE_REPO@$API_DIGEST\"}}"
          url="${NUDGE_SERVER_URL%/}/api/v1/deployments/$NUDGE_DEPLOYMENT/deploys?stream=1"
          echo "deploying $TAG to $NUDGE_DEPLOYMENT: $body"

          # One JSON line per progress event, `{}` every 25 s while nothing happens, and
          # last the run's result. Errors before the run is queued (bad token, a variable
          # the deployment doesn't allow, ...) are a plain JSON error and an HTTP error.
          progress=$(mktemp)
          if ! printf 'header = "Authorization: Bearer %s"\n' "$NUDGE_DEPLOY_TOKEN" |
            curl -sS -N --fail-with-body --connect-timeout 30 --max-time 1200 -K - \
              -H 'Content-Type: application/json' --data "$body" "$url" | tee "$progress"; then
            echo >&2
            echo "deploy request failed: nudge refused it or the stream broke off (see above)." >&2
            echo "A run that was already queued keeps going in nudge; check it there." >&2
            exit 1
          fi

          last=$(grep -v '^[[:space:]]*$' "$progress" | tail -n 1 || true)
          status=$(printf '%s' "$last" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              try { const v = JSON.parse(s).status; if (typeof v === "string") process.stdout.write(v); } catch {}
            });')
          if [ "$status" != succeeded ]; then
            echo "deploy run ended '${status:-without a final status}'; see the last lines above and the run in nudge." >&2
            exit 1
          fi
          echo "deployed $TAG to $NUDGE_DEPLOYMENT"
