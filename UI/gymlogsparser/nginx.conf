# Proto and host as the outer reverse proxy saw them; fall back to this hop.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # OIDC cookies (chunked) can be large in both directions.
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;

    # Docker's DNS, so a recreated api container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API controllers (all under /api) and the OIDC handler's callbacks.
    location ~ ^/(api/|signin-oidc$|signout-callback-oidc$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_read_timeout 120s;  # AI parsing may take up to 90 s
        client_max_body_size 5m;
    }

    # Hashed build assets never change.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Everything else is the SPA (including /auth/error, /signed-out).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
